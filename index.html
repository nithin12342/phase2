<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Drawer - Glass Morphic Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.05) 0%, transparent 20%),
                radial-gradient(circle at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 20%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.05),
                transparent
            );
            transform: rotate(30deg);
            animation: shine 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(30deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(30deg);
            }
        }

        h1 {
            color: white;
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: #ff0;
            border-radius: 2px;
        }

        #drawButton {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
            position: relative;
            overflow: hidden;
        }

        #drawButton:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.6);
            background: linear-gradient(135deg, #fad0c4, #ff9a9e);
        }

        #drawButton:active {
            transform: translateY(0);
        }

        #drawButton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        #drawButton:hover::before {
            left: 100%;
        }

        #output {
            margin-top: 30px;
            min-height: 80px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        #output.empty {
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        .stats {
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 16px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            #drawButton {
                padding: 14px 28px;
                font-size: 1rem;
            }
            
            #output {
                font-size: 1.1rem;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Name Drawer</h1>
        <button id="drawButton">Draw a Name</button>
        <div id="output" class="output">Click the button to draw a name</div>
        <div class="stats">
            <div class="stat-item" id="totalNames">Total: 0</div>
            <div class="stat-item" id="remainingNames">Remaining: 0</div>
        </div>
    </div>

    <script>
        // List of names (trimmed whitespace from original)
        const names = [
            "Gukanamashivayan", "Jaishnav", "Logesh", "Asmitha",
            "Sree Varshini", "Nithillah", "Mirthula", "Pavithra",
            "Sri Vidhya", "Sooraj", "Divakar",
            "Kannika", "Shrilaja", "Shubhashree", "Urekhasri",
            "Priyadharshini", "Sangeetha", "Navya Sri", "Priya",
            "Hemadharshini", "Nishanthini", "Dinesh", "Harish Kumar",
            "Aksa Mary", "Adlin", "Sameul", "Karunya",
            "Swathi", "Mohankumar" 
        ];

        let remainingNames = [...names]; // Copy of names array
        
        // DOM elements
        const drawButton = document.getElementById('drawButton');
        const outputDiv = document.getElementById('output');
        const totalNamesSpan = document.getElementById('totalNames');
        const remainingNamesSpan = document.getElementById('remainingNames');

        // Initialize display
        function updateDisplay() {
            totalNamesSpan.textContent = `Total: ${names.length}`;
            remainingNamesSpan.textContent = `Remaining: ${remainingNames.length}`;
            
            if (remainingNames.length === 0) {
                outputDiv.textContent = "All names have been drawn!";
                outputDiv.className = "output empty";
                drawButton.disabled = true;
                drawButton.style.opacity = "0.6";
                drawButton.style.cursor = "not-allowed";
            } else if (outputDiv.textContent === "Click the button to draw a name" || 
                      outputDiv.textContent === "All names have been drawn!") {
                // Only reset if it's the initial message or all drawn message
                outputDiv.textContent = "Click the button to draw a name";
                outputDiv.className = "output";
            }
        }

        // Handle button click
        function drawName() {
            if (remainingNames.length === 0) return;

            // Select random name
            const randomIndex = Math.floor(Math.random() * remainingNames.length);
            const selectedName = remainingNames[randomIndex];
            
            // Remove selected name from remaining
            remainingNames.splice(randomIndex, 1);
            
            // Update output with animation
            outputDiv.textContent = selectedName;
            outputDiv.className = "output";
            
            // Add animation class
            outputDiv.style.animation = 'pulse 0.5s';
            setTimeout(() => {
                outputDiv.style.animation = '';
            }, 500);
            
            updateDisplay();
        }

        // Pulse animation for output
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        // Event listeners
        drawButton.addEventListener('click', drawName);
        
        // Initialize
        updateDisplay();
    </script>
</body>
</html>
